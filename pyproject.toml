[project]
name = "beerling-2025-analysis"
version = "0.1.0"
description = "Analysis of the Beerling et al. (2025) enhanced-weathering model and its published outputs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "cmocean>=4.0",
    "xarray>=2024.10",
    "zarr>=3",
    "s3fs>=2024.6",
    "boto3>=1.34",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "pdfplumber>=0.11.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beerling_analysis"]
